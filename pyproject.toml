[project]
name = "personal-ai-dashboard"
version = "0.1.0"
description = "Local personal dashboard with SQL-backed history, Google sign-in and OpenAI-assisted entry."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "openai>=1.40",
    "pypdf>=4.3",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",  # IANA zones for Asia/Jerusalem on Windows (approved 2026-10-16)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S104", "S404", "S603", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["authlib.*", "joserfc.*"]
ignore_missing_imports = true
